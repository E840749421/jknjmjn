<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart CampusFix - Map Dashboard</title>
    <script src="https://jsdelivr.net"></script>
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
    <link rel="stylesheet" href="https://jsdelivr.net" />
    <script type="text/javascript" src="https://jsdelivr.net"></script>
</head>

<body>


    <img src="/static/images/jk.jpg" alt="" width="70" height="78">



    <style>
        body {
            background-color: yellow;
        }
        
        h1 {
            color: blue;
        }
    </style>


    class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">
    <header class="bg-slate-950 border-b border-slate-800 p-4 flex justify-between items-center">
        <div>
            <h1 class="text-md font-bold">Smart CampusFix Homepage</h1>
            <p class="text-xs text-slate-400">Logged in as Student: {{ user_name }}</p>
        </div>
        <a href="/logout" class="text-xs text-red-400 font-bold bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-800">Sign Out</a>
    </header>

    <main class="max-w-6xl mx-auto p-4 flex-1 w-full space-y-6">
        <section class="bg-slate-950 border border-slate-800 rounded-2xl p-4 space-y-2">
            <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Interactive Institutional Map Layout</h2>
            <div class="h-64 bg-slate-900 rounded-xl border border-slate-800 overflow-hidden relative z-10" id="masterMap"></div>
        </section>

        <section class="grid grid-cols-1 lg:grid-cols-5 gap-6">
            <div class="lg:col-span-2 bg-slate-950/60 border border-slate-800 rounded-2xl p-5">
                <form id="ticketForm" class="space-y-4">
                    <input type="hidden" id="buildingName">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Target Area</label>
                        <div id="buildingLabel" class="p-3 bg-slate-950 border border-slate-900 text-xs text-slate-500 rounded-xl">Tap a pin on the homepage map...</div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <input type="text" id="roomName" placeholder="Room/Lobby Code" required class="bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs">
                        <select id="priority" class="bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-300">
                            <option value="Low">Low Routine</option><option value="Medium">Medium Urgent</option><option value="Emergency">Emergency</option>
                        </select>
                    </div>
                    <textarea id="description" rows="3" placeholder="Describe infrastructure fault details..." required class="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs resize-none"></textarea>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl text-xs cursor-pointer">Dispatch Fault Report</button>
                </form>
            </div>
            <div class="lg:col-span-3 bg-slate-950 border border-slate-800 rounded-2xl overflow-hidden min-h-[300px]" id="panoCanvas">
                <p class="text-xs text-slate-500 text-center p-24">Tap a map pin to initialize eye-level walking perspective walkthrough</p>
            </div>
        </section>
    </main>

    <script>
        const landmarks = {
            "Central Library Square": {
                coords: [-1.2910, 36.8205],
                url: "https://pannellum.org"
            },
            "Science Laboratory Hall": {
                coords: [-1.2921, 36.8219],
                url: "https://pannellum.org"
            }
        };
        const map = L.map('masterMap', {
            scrollWheelZoom: false
        }).setView([-1.215, 36.821], 12);
        L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png').addTo(map);

        Object.keys(landmarks).forEach(name => {
            L.marker(landmarks[name].coords).addTo(map).on('click', () => {
                map.panTo(landmarks[name].coords);
                document.getElementById('buildingName').value = name;
                document.getElementById('buildingLabel').textContent = name;
                document.getElementById('buildingLabel').className = "p-3 bg-blue-500/10 border border-blue-500/20 text-xs text-blue-400 font-bold rounded-xl";

                pannellum.viewer('panoCanvas', {
                    "type": "equirectangular",
                    "panorama": landmarks[name].url,
                    "autoLoad": true,
                    "showControls": true
                });
            });
        });

        document.getElementById('ticketForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const bld = document.getElementById('buildingName').value;
            if (!bld) {
                alert("Please tap a marker pin on the map first.");
                return;
            }

            const fd = new FormData();
            fd.append('building', bld);
            fd.append('room', document.getElementById('roomName').value)

            fd.append('category', 'General Facility');
            fd.append('priority', document.getElementById('priority').value);
            fd.append('description', document.getElementById('description').value);

            const res = await fetch('/api/tickets/create', {
                method: 'POST',
                body: fd
            });
            if (res.ok) {
                alert("Report dispatched publicly! Notification logged.");
                this.reset();
            }
        });
    </script>



    <h2>james</h2>
    <br><br>
    <p>my name</p>
</body>

</html>
